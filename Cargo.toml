[package]
name = "ard-rs"
version = "0.1.0"
edition = "2024"
description = "Pure Rust parser and framebuffer decoder for Apple Remote Desktop screen sharing"
license = "MIT OR Apache-2.0"

[features]
default = []
viewer = [
    "dep:arboard",
    "dep:bytemuck",
    "dep:getrandom",
    "dep:pollster",
    "dep:wgpu",
    "dep:winit",
]

[dependencies]
aes = { version = "0.8.4", default-features = false }
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"], optional = true }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
md-5 = { version = "0.10.6", default-features = false }
num-bigint = { version = "0.4.6", default-features = false, features = ["std"] }
sha1 = { version = "0.10.6", default-features = false }
subtle = { version = "2.6.1", default-features = false }
bytemuck = { version = "1.25.0", optional = true }
getrandom = { version = "0.3.4", optional = true }
pollster = { version = "0.4.0", optional = true }
wgpu = { version = "30.0.0", optional = true }
winit = { version = "0.30.13", optional = true }

[dev-dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
naga = { version = "30.0.0", features = ["wgsl-in"] }

[[bin]]
name = "ard-viewer"
path = "src/bin/ard-viewer.rs"
required-features = ["viewer"]

[[example]]
name = "live_metrics"
path = "examples/live_metrics.rs"
required-features = ["viewer"]
