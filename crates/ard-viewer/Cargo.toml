[package]
name = "ard-viewer"
version = "0.1.0"
edition = "2024"
description = "Native GUI viewer for Apple Remote Desktop sessions"
license = "MIT OR Apache-2.0"

[dependencies]
ard_rs = { package = "ard-core", path = "../ard-core" }
iced = { version = "0.14.0", default-features = false, features = ["crisp", "linux-theme-detection", "thread-pool", "wayland", "wgpu", "x11"] }

[dev-dependencies]
iced_test = "0.14.0"
