[package]
name = "ard-viewer"
version = "0.1.0"
edition = "2024"
description = "Native GUI viewer for Apple Remote Desktop sessions"
license = "MIT OR Apache-2.0"

[dependencies]
ard_rs = { package = "ard-core", path = "../ard-core" }
bytemuck = "1.25.0"
aes-gcm = "0.10"
directories = "5.0.1"
gethostname = "1"
getrandom = "0.4"
iced = { git = "https://github.com/iced-rs/iced.git", rev = "ee67bff38b89dafec8a42d1ed6b8c4b9faba817b", version = "0.15.0-dev", default-features = false, features = ["advanced", "crisp", "linux-theme-detection", "svg", "tokio", "wayland", "wgpu", "x11"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "29"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"

[target.'cfg(target_os = "windows")'.dependencies]
hookmap-core = { version = "0.2.1", default-features = false, features = ["us-keyboard-layout"] }

[dev-dependencies]
iced_test = { git = "https://github.com/iced-rs/iced.git", rev = "ee67bff38b89dafec8a42d1ed6b8c4b9faba817b", version = "0.15.0-dev" }
naga = { version = "30.0.0", features = ["wgsl-in"] }
