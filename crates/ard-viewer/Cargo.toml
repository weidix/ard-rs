[package]
name = "ard-viewer"
version = "0.1.0"
edition = "2024"
description = "Native GUI viewer for Apple Remote Desktop sessions"
license = "MIT OR Apache-2.0"

[dependencies]
ard_rs = { package = "ard-core", path = "../ard-core" }
bytemuck = "1.25.0"
directories = "5.0.1"
iced = { git = "https://github.com/iced-rs/iced.git", rev = "4cad51ba61e3d76a7e696ad5923d675a20994e34", version = "0.15.0-dev", default-features = false, features = ["advanced", "crisp", "linux-theme-detection", "svg", "tokio", "wayland", "wgpu", "x11"] }
keyring = "4.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "29"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"

[dev-dependencies]
iced_test = { git = "https://github.com/iced-rs/iced.git", rev = "4cad51ba61e3d76a7e696ad5923d675a20994e34", version = "0.15.0-dev" }
naga = { version = "30.0.0", features = ["wgsl-in"] }
